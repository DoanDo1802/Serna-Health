spring:
  datasource:
    url: ${MEDICORE_DB_URL:jdbc:postgresql://localhost:5432/medicore}
    username: ${MEDICORE_DB_USERNAME:medicore}
    password: ${MEDICORE_DB_PASSWORD:medicore-local-only}

medicore:
  auth:
    secret-hash-key: ${MEDICORE_AUTH_SECRET_HASH_KEY:local-only-key-at-least-thirty-two-bytes}
    session:
      secure-cookie: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: true
    path: /api/v1/swagger-ui
    url: /api/v1/medicore.openapi.yaml
