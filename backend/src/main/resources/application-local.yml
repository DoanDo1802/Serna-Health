spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${MEDICORE_DB_URL:jdbc:postgresql://localhost:5432/medicore}
    username: ${MEDICORE_DB_USERNAME:medicore}
    password: ${MEDICORE_DB_PASSWORD:medicore-local-only}
  mail:
    host: ${MEDICORE_MAIL_HOST:smtp.gmail.com}
    port: ${MEDICORE_MAIL_PORT:587}
    username: ${MEDICORE_MAIL_USERNAME}
    password: ${MEDICORE_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  flyway:
    enabled: true

medicore:
  crypto:
    encryption-key: ${MEDICORE_CRYPTO_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    comparison-key: ${MEDICORE_CRYPTO_COMPARISON_KEY:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210}
  auth:
    otp:
      resend-cooldown: 0s
      max-issues-per-hour: 10000
    secret-hash-key: ${MEDICORE_AUTH_SECRET_HASH_KEY}
    session:
      cookie-name-prefix: MEDICORE_SESSION_
      secure-cookie: false
  payment:
    mock-enabled: true
    webhook-secret: local-mock-payment-webhook-secret-key-32bytes-min

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: true
    path: /api/v1/swagger-ui
    url: /api/v1/medicore.openapi.yaml
