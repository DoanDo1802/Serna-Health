spring:
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate

medicore:
  crypto:
    encryption-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    comparison-key: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
  auth:
    secret-hash-key: test-only-key-at-least-thirty-two-bytes
    session:
      secure-cookie: false
  payment:
    mock-enabled: true
    webhook-secret: test-mock-payment-webhook-secret-key-32bytes-min
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
