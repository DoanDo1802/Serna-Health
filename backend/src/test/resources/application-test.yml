spring:
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate

medicore:
  auth:
    secret-hash-key: test-only-key-at-least-thirty-two-bytes
    session:
      secure-cookie: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
