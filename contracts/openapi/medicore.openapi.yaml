  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 512
    TabContext:
      name: X-MediCore-Tab-Context
      in: header
      required: true
      description: Non-secret 128-bit tab selector. It selects a context-scoped HttpOnly session cookie and never authenticates by itself.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{22}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    RequestId:
      description: Request identifier generated or accepted by server.
      schema:
        type: string
    CorrelationId:
      description: End-to-end correlation identifier.
      schema:
        type: string
    ETag:
      description: Strong optimistic-version ETag.
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    Resource:
      description: Resource response.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Resource'
    ResourceList:
      description: Cursor-paginated resources.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CursorPage'
    Accepted:
      description: Accepted without exposing resource existence or processing detail.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandAccepted'
    NoContent:
      description: Command completed without response body.
    Problem:
      description: Stable MediCore problem response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication required or failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated principal lacks contextual permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or intentionally concealed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Domain state or idempotency conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match ETag is stale.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match header is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: MEDICORE_SESSION_<tab-context>
      description: Context-selected opaque HttpOnly server-side session cookie. Every session request also requires X-MediCore-Tab-Context; unsafe browser requests require the session-bound X-CSRF-Token.
    paymentWebhookSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: Provider-specific signature over exact raw request body and signed metadata.
