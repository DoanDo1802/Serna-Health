parameters:
  RequestId:
    name: X-Request-Id
    in: header
    required: false
    schema: { type: string, maxLength: 128 }
  CorrelationId:
    name: X-Correlation-Id
    in: header
    required: false
    schema: { type: string, maxLength: 128 }
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: true
    schema: { type: string, minLength: 8, maxLength: 128 }
  CsrfToken:
    name: X-CSRF-Token
    in: header
    required: true
    schema: { type: string, minLength: 16, maxLength: 512 }
  TabContext:
    name: X-MediCore-Tab-Context
    in: header
    required: true
    description: Non-secret 128-bit tab selector. It selects a context-scoped HttpOnly session cookie and never authenticates by itself.
    schema: { type: string, pattern: '^[A-Za-z0-9_-]{22}$' }
  IfMatch:
    name: If-Match
    in: header
    required: true
    schema: { type: string, pattern: '^"[0-9]+"$' }
  Cursor:
    name: cursor
    in: query
    required: false
    schema: { type: string, maxLength: 1024 }
  Limit:
    name: limit
    in: query
    required: false
    schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
headers:
  RequestId:
    description: Request identifier generated or accepted by server.
    schema: { type: string }
  CorrelationId:
    description: End-to-end correlation identifier.
    schema: { type: string }
  ETag:
    description: Strong optimistic-version ETag.
    schema: { type: string, pattern: '^"[0-9]+"$' }
schemas:
  Uuid:
    type: string
    format: uuid
  Instant:
    type: string
    format: date-time
  LocalDate:
    type: string
    format: date
  Money:
    type: object
    additionalProperties: false
    required: [amount, currency]
    properties:
      amount: { type: string, pattern: '^\\d{1,17}\\.\\d{2}$' }
      currency: { type: string, const: VND }
  ReasonCommand:
    type: object
    additionalProperties: false
    required: [reason]
    properties:
      reason: { type: string, minLength: 1, maxLength: 500 }
  GenericCommand:
    type: object
    additionalProperties: true
    description: Operation-specific fields are constrained by the operation description and will be replaced by typed DTOs before implementation.
  Resource:
    type: object
    additionalProperties: true
    required: [id]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      version: { type: integer, format: int64, minimum: 0 }
      status: { type: string }
      createdAt: { $ref: '#/schemas/Instant' }
      updatedAt: { $ref: '#/schemas/Instant' }
  CommandAccepted:
    type: object
    additionalProperties: false
    required: [accepted, requestId]
    properties:
      accepted: { type: boolean, const: true }
      requestId: { type: string }
  CursorPage:
    type: object
    additionalProperties: false
    required: [items, hasMore]
    properties:
      items:
        type: array
        items: { $ref: '#/schemas/Resource' }
      nextCursor: { type: [string, 'null'] }
      hasMore: { type: boolean }
responses:
  Resource:
    description: Resource response.
    headers:
      X-Request-Id: { $ref: '#/headers/RequestId' }
      X-Correlation-Id: { $ref: '#/headers/CorrelationId' }
      ETag: { $ref: '#/headers/ETag' }
    content:
      application/json:
        schema: { $ref: '#/schemas/Resource' }
  ResourceList:
    description: Cursor-paginated resources.
    headers:
      X-Request-Id: { $ref: '#/headers/RequestId' }
      X-Correlation-Id: { $ref: '#/headers/CorrelationId' }
    content:
      application/json:
        schema: { $ref: '#/schemas/CursorPage' }
  Accepted:
    description: Accepted without exposing resource existence or processing detail.
    content:
      application/json:
        schema: { $ref: '#/schemas/CommandAccepted' }
  NoContent:
    description: Command completed without response body.
