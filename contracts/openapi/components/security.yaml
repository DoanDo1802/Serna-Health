securitySchemes:
  sessionCookie:
    type: apiKey
    in: cookie
    name: MEDICORE_SESSION_<tab-context>
    description: Context-selected opaque HttpOnly server-side session cookie. Every session request also requires X-MediCore-Tab-Context; unsafe browser requests require the session-bound X-CSRF-Token.
  paymentWebhookSignature:
    type: apiKey
    in: header
    name: X-Provider-Signature
    description: Provider-specific signature over exact raw request body and signed metadata.
