schemas:
  FieldError:
    type: object
    additionalProperties: false
    required: [field, code]
    properties:
      field: { type: string }
      code: { type: string }
      message: { type: string }
  Blocker:
    type: object
    additionalProperties: false
    required: [code, message]
    properties:
      code: { type: string }
      message: { type: string }
      resourceType: { type: [string, 'null'] }
      resourceId: { type: [string, 'null'], format: uuid }
  Problem:
    type: object
    additionalProperties: false
    required: [type, title, status, code, requestId]
    properties:
      type: { type: string, format: uri-reference }
      title: { type: string }
      status: { type: integer, minimum: 400, maximum: 599 }
      detail: { type: string }
      instance: { type: string, format: uri-reference }
      code: { type: string, pattern: '^(AUTH|ACCESS|VALIDATION|RESOURCE|STATE|CONCURRENCY|IDEMPOTENCY|CAPACITY|PAYMENT|CLINICAL|BILLING)_[A-Z0-9_]+$' }
      requestId: { type: string }
      correlationId: { type: [string, 'null'] }
      fieldErrors:
        type: array
        items: { $ref: '#/schemas/FieldError' }
      blockers:
        type: array
        items: { $ref: '#/schemas/Blocker' }
      retryAfterSeconds: { type: [integer, 'null'], minimum: 0 }
responses:
  Problem:
    description: Stable MediCore problem response.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  Unauthorized:
    description: Authentication required or failed.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  Forbidden:
    description: Authenticated principal lacks contextual permission.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  NotFound:
    description: Resource not found or intentionally concealed.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  Conflict:
    description: Domain state or idempotency conflict.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  PreconditionFailed:
    description: If-Match ETag is stale.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  PreconditionRequired:
    description: If-Match header is required.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  TooManyRequests:
    description: Rate limit exceeded.
    headers:
      Retry-After:
        schema: { type: integer, minimum: 1 }
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
