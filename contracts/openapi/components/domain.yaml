schemas:
  AccountStatus:
    type: string
    enum: [PENDING_VERIFICATION, ACTIVE, TEMPORARILY_LOCKED, DISABLED, PERMANENTLY_LOCKED]
  SessionStatus:
    type: string
    enum: [ACTIVE, EXPIRED, REVOKED]
  AccountRoleAssignmentStatus:
    type: string
    enum: [ACTIVE, REVOKED, EXPIRED]
  BreakGlassGrantStatus:
    type: string
    enum: [REQUESTED, ACTIVE, EXPIRED, REVOKED, REVIEWED]
  AuditOutcome:
    type: string
    enum: [SUCCEEDED, DENIED, FAILED]

  AuthRegistrationRequest:
    type: object
    additionalProperties: false
    required: [email, password]
    properties:
      email: { type: string, format: email, maxLength: 320 }
      password: { type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true }
  OtpChallengeRequest:
    type: object
    additionalProperties: false
    required: [email]
    properties:
      email: { type: string, format: email, maxLength: 320 }
  OtpSessionRequest:
    type: object
    additionalProperties: false
    required: [email, code]
    properties:
      email: { type: string, format: email, maxLength: 320 }
      code: { type: string, minLength: 6, maxLength: 12, writeOnly: true }
  EmailVerificationRequest:
    oneOf:
      - type: object
        additionalProperties: false
        required: [email, code]
        properties:
          email: { type: string, format: email, maxLength: 320 }
          code: { type: string, minLength: 6, maxLength: 12, writeOnly: true }
      - type: object
        additionalProperties: false
        required: [token]
        properties:
          token: { type: string, minLength: 32, maxLength: 512, writeOnly: true }
  PasswordSessionRequest:
    type: object
    additionalProperties: false
    required: [email, password]
    properties:
      email: { type: string, format: email, maxLength: 320 }
      password: { type: string, format: password, minLength: 1, maxLength: 128, writeOnly: true }
  PasswordResetRequest:
    type: object
    additionalProperties: false
    required: [token, newPassword]
    properties:
      token: { type: string, minLength: 32, maxLength: 512, writeOnly: true }
      newPassword: { type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true }
  ChangePasswordRequest:
    type: object
    additionalProperties: false
    required: [currentPassword, newPassword]
    properties:
      currentPassword: { type: string, format: password, minLength: 1, maxLength: 128, writeOnly: true }
      newPassword: { type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true }
  ChangeAccountStatusRequest:
    type: object
    additionalProperties: false
    required: [status, reason]
    properties:
      status: { $ref: '#/schemas/AccountStatus' }
      reason: { type: string, minLength: 1, maxLength: 500 }
  CreateRoleRequest:
    type: object
    additionalProperties: false
    required: [code, name]
    properties:
      code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 64 }
      name: { type: string, minLength: 1, maxLength: 200 }
  ReplaceRolePermissionsRequest:
    type: object
    additionalProperties: false
    required: [permissionIds]
    properties:
      permissionIds:
        type: array
        uniqueItems: true
        items: { type: string, format: uuid }
  AssignAccountRoleRequest:
    type: object
    additionalProperties: false
    required: [roleId, effectiveFrom, reason]
    properties:
      roleId: { type: string, format: uuid }
      departmentId: { type: [string, 'null'], format: uuid }
      effectiveFrom: { type: string, format: date-time }
      effectiveTo: { type: [string, 'null'], format: date-time }
      reason: { type: string, minLength: 1, maxLength: 500 }
  PersonnelType:
    type: string
    enum: [DOCTOR, STAFF]
  PractitionerGender:
    type: string
    enum: [MALE, FEMALE, OTHER, UNSPECIFIED]
  DoctorProfessionalProfileInput:
    type: object
    additionalProperties: false
    required: [phone, dateOfBirth, gender, address, professionalTitle, academicDegree, specialtyDesignation, licenseNumber, licensingAuthority, licenseIssuedOn, yearsExperience]
    properties:
      phone: { type: string, pattern: '^[+][1-9][0-9]{7,14}$', maxLength: 16 }
      dateOfBirth: { type: string, format: date }
      gender: { $ref: '#/schemas/PractitionerGender' }
      address: { type: string, minLength: 1, maxLength: 1000 }
      professionalTitle: { type: string, minLength: 1, maxLength: 200 }
      academicDegree: { type: string, minLength: 1, maxLength: 200 }
      specialtyDesignation: { type: string, minLength: 1, maxLength: 200 }
      licenseNumber: { type: string, minLength: 1, maxLength: 128 }
      licensingAuthority: { type: string, minLength: 1, maxLength: 200 }
      licenseIssuedOn: { type: string, format: date }
      licenseExpiresOn: { type: [string, 'null'], format: date }
      yearsExperience: { type: integer, minimum: 0, maximum: 80 }
      biography: { type: [string, 'null'], maxLength: 4000 }
      avatarUrl: { type: [string, 'null'], format: uri, maxLength: 2048 }
  PersonnelProvisionRequest:
    oneOf:
      - type: object
        additionalProperties: false
        required: [type, email, initialPassword, staffCode, fullName, departmentId, doctorProfile]
        properties:
          type: { const: DOCTOR }
          email: { type: string, format: email, maxLength: 320 }
          initialPassword: { type: string, format: password, minLength: 6, maxLength: 128, writeOnly: true }
          staffCode: { type: string, minLength: 1, maxLength: 64 }
          fullName: { type: string, minLength: 1, maxLength: 200 }
          departmentId: { type: string, format: uuid }
          doctorProfile: { $ref: '#/schemas/DoctorProfessionalProfileInput' }
      - type: object
        additionalProperties: false
        required: [type, email, initialPassword, staffCode, fullName]
        properties:
          type: { const: STAFF }
          email: { type: string, format: email, maxLength: 320 }
          initialPassword: { type: string, format: password, minLength: 6, maxLength: 128, writeOnly: true }
          staffCode: { type: string, minLength: 1, maxLength: 64 }
          fullName: { type: string, minLength: 1, maxLength: 200 }
  PersonnelUpdateRequest:
    oneOf:
      - type: object
        additionalProperties: false
        required: [type, staffCode, fullName, departmentId, doctorProfile]
        properties:
          type: { const: DOCTOR }
          staffCode: { type: string, minLength: 1, maxLength: 64 }
          fullName: { type: string, minLength: 1, maxLength: 200 }
          departmentId: { type: string, format: uuid }
          doctorProfile: { $ref: '#/schemas/DoctorProfessionalProfileInput' }
      - type: object
        additionalProperties: false
        required: [type, staffCode, fullName]
        properties:
          type: { const: STAFF }
          staffCode: { type: string, minLength: 1, maxLength: 64 }
          fullName: { type: string, minLength: 1, maxLength: 200 }
  DoctorProfessionalProfile:
    type: object
    additionalProperties: false
    required: [version, phone, dateOfBirth, gender, address, professionalTitle, academicDegree, specialtyDesignation, licenseNumber, licensingAuthority, licenseIssuedOn, yearsExperience, createdAt, updatedAt]
    properties:
      version: { type: integer, format: int64, minimum: 0 }
      phone: { type: string, maxLength: 16 }
      dateOfBirth: { type: string, format: date }
      gender: { $ref: '#/schemas/PractitionerGender' }
      address: { type: string, maxLength: 1000 }
      professionalTitle: { type: string, maxLength: 200 }
      academicDegree: { type: string, maxLength: 200 }
      specialtyDesignation: { type: string, maxLength: 200 }
      licenseNumber: { type: string, maxLength: 128 }
      licensingAuthority: { type: string, maxLength: 200 }
      licenseIssuedOn: { type: string, format: date }
      licenseExpiresOn: { type: [string, 'null'], format: date }
      yearsExperience: { type: integer, minimum: 0, maximum: 80 }
      biography: { type: [string, 'null'], maxLength: 4000 }
      avatarUrl: { type: [string, 'null'], format: uri, maxLength: 2048 }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
  Personnel:
    type: object
    additionalProperties: false
    required: [accountId, accountVersion, type, displayEmail, accountStatus, staffCode, fullName, active, createdAt, updatedAt]
    properties:
      accountId: { type: string, format: uuid }
      accountVersion: { type: integer, format: int64, minimum: 0 }
      type: { $ref: '#/schemas/PersonnelType' }
      displayEmail: { type: string, format: email, maxLength: 320 }
      accountStatus: { $ref: '#/schemas/AccountStatus' }
      practitionerId: { type: [string, 'null'], format: uuid }
      practitionerVersion: { type: [integer, 'null'], format: int64, minimum: 0 }
      staffCode: { type: string, maxLength: 64 }
      fullName: { type: string, maxLength: 200 }
      active: { type: boolean }
      departmentId: { type: [string, 'null'], format: uuid }
      practitionerRoleId: { type: [string, 'null'], format: uuid }
      accountRoleAssignmentId: { type: string, format: uuid }
      doctorProfile: { anyOf: [{ $ref: '#/schemas/DoctorProfessionalProfile' }, { type: 'null' }] }
      deactivatedAt: { type: [string, 'null'], format: date-time }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
  PersonnelPage:
    type: object
    additionalProperties: false
    required: [items, hasMore]
    properties:
      items: { type: array, items: { $ref: '#/schemas/Personnel' } }
      nextCursor: { type: [string, 'null'], maxLength: 1024 }
      hasMore: { type: boolean }

  BreakGlassGrantRequest:
    type: object
    additionalProperties: false
    required: [purpose, reason, ttlMinutes, alertReference, ticketReference]
    properties:
      purpose: { type: string, minLength: 1, maxLength: 500 }
      reason: { type: string, minLength: 1, maxLength: 500 }
      ttlMinutes: { type: integer, minimum: 1, maximum: 240 }
      alertReference: { type: string, minLength: 1, maxLength: 128 }
      ticketReference: { type: string, minLength: 1, maxLength: 128 }
  ReviewBreakGlassGrantRequest:
    type: object
    additionalProperties: false
    required: [outcome, reason]
    properties:
      outcome: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 64 }
      reason: { type: string, minLength: 1, maxLength: 500 }

  Account:
    type: object
    additionalProperties: false
    required: [id, version, displayEmail, status, failedLoginCount, createdAt, updatedAt]
    properties:
      id: { type: string, format: uuid }
      version: { type: integer, format: int64, minimum: 0 }
      displayEmail: { type: string, format: email, maxLength: 320 }
      emailVerifiedAt: { type: [string, 'null'], format: date-time }
      status: { $ref: '#/schemas/AccountStatus' }
      failedLoginCount: { type: integer, minimum: 0, maximum: 5 }
      lockedUntil: { type: [string, 'null'], format: date-time }
      lastAuthenticatedAt: { type: [string, 'null'], format: date-time }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
  Session:
    type: object
    additionalProperties: false
    required: [accountId, displayEmail, status, authenticatedAt, lastSeenAt, idleExpiresAt, absoluteExpiresAt, roleCodes, permissions]
    properties:
      accountId: { type: string, format: uuid }
      displayEmail: { type: string, format: email, maxLength: 320 }
      status: { $ref: '#/schemas/SessionStatus' }
      authenticatedAt: { type: string, format: date-time }
      lastSeenAt: { type: string, format: date-time }
      idleExpiresAt: { type: string, format: date-time }
      absoluteExpiresAt: { type: string, format: date-time }
      roleCodes:
        type: array
        uniqueItems: true
        items: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 64 }
      permissions:
        type: array
        uniqueItems: true
        items: { type: string, pattern: '^[a-z][a-z0-9_.]*$', maxLength: 128 }
  Role:
    type: object
    additionalProperties: false
    required: [id, version, code, name, active, permissionIds, createdAt]
    properties:
      id: { type: string, format: uuid }
      version: { type: integer, format: int64, minimum: 0 }
      code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 64 }
      name: { type: string, minLength: 1, maxLength: 200 }
      active: { type: boolean }
      permissionIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
      createdAt: { type: string, format: date-time }
  Permission:
    type: object
    additionalProperties: false
    required: [id, action, description, active, createdAt]
    properties:
      id: { type: string, format: uuid }
      action: { type: string, pattern: '^[a-z][a-z0-9_.]*$', maxLength: 128 }
      description: { type: string, maxLength: 500 }
      active: { type: boolean }
      createdAt: { type: string, format: date-time }
  AccountRoleAssignment:
    type: object
    additionalProperties: false
    required: [id, accountId, roleId, effectiveFrom, status, assignedByAccountId, reason, version]
    properties:
      id: { type: string, format: uuid }
      accountId: { type: string, format: uuid }
      roleId: { type: string, format: uuid }
      departmentId: { type: [string, 'null'], format: uuid }
      effectiveFrom: { type: string, format: date-time }
      effectiveTo: { type: [string, 'null'], format: date-time }
      status: { $ref: '#/schemas/AccountRoleAssignmentStatus' }
      assignedByAccountId: { type: string, format: uuid }
      reason: { type: string, maxLength: 500 }
      version: { type: integer, format: int64, minimum: 0 }
  BreakGlassGrant:
    type: object
    additionalProperties: false
    required: [id, requesterAccountId, patientId, purpose, reason, requestedAt, alertReference, ticketReference, requestId, sessionId, correlationId, status, version]
    properties:
      id: { type: string, format: uuid }
      requesterAccountId: { type: string, format: uuid }
      grantorAccountId: { type: [string, 'null'], format: uuid }
      reviewerAccountId: { type: [string, 'null'], format: uuid }
      patientId: { type: string, format: uuid }
      purpose: { type: string, maxLength: 500 }
      reason: { type: string, maxLength: 500 }
      requestedAt: { type: string, format: date-time }
      grantedAt: { type: [string, 'null'], format: date-time }
      effectiveFrom: { type: [string, 'null'], format: date-time }
      expiresAt: { type: [string, 'null'], format: date-time }
      reviewDueAt: { type: [string, 'null'], format: date-time }
      reviewedAt: { type: [string, 'null'], format: date-time }
      alertReference: { type: string, maxLength: 128 }
      ticketReference: { type: string, maxLength: 128 }
      requestId: { type: string, maxLength: 128 }
      sessionId: { type: string, maxLength: 128 }
      correlationId: { type: string, maxLength: 128 }
      status: { $ref: '#/schemas/BreakGlassGrantStatus' }
      reviewOutcome: { type: [string, 'null'], maxLength: 64 }
      reviewReason: { type: [string, 'null'], maxLength: 500 }
      version: { type: integer, format: int64, minimum: 0 }
  AuditEvent:
    type: object
    additionalProperties: false
    required: [id, actorType, purpose, authorizationBasis, resourceType, action, outcome, sourceSystem, sourceEvent, requestId, correlationId, exportEvent, downloadEvent, occurredAt]
    properties:
      id: { type: string, format: uuid }
      actorType: { type: string, maxLength: 64 }
      actorAccountId: { type: [string, 'null'], format: uuid }
      effectiveRoleSnapshot: { type: [object, 'null'], additionalProperties: true }
      patientId: { type: [string, 'null'], format: uuid }
      purpose: { type: string, maxLength: 256 }
      authorizationBasis: { type: string, maxLength: 256 }
      resourceType: { type: string, maxLength: 128 }
      resourceId: { type: [string, 'null'], format: uuid }
      resourceVersion: { type: [integer, 'null'], format: int64 }
      resourceDigest: { type: [string, 'null'], maxLength: 128 }
      action: { type: string, maxLength: 128 }
      outcome: { $ref: '#/schemas/AuditOutcome' }
      reason: { type: [string, 'null'], maxLength: 500 }
      sourceSystem: { type: string, maxLength: 128 }
      sourceEvent: { type: string, maxLength: 128 }
      sessionId: { type: [string, 'null'], maxLength: 128 }
      requestId: { type: string, maxLength: 128 }
      correlationId: { type: string, maxLength: 128 }
      beforeRedacted: { type: [object, 'null'], additionalProperties: true }
      afterRedacted: { type: [object, 'null'], additionalProperties: true }
      exportEvent: { type: boolean }
      downloadEvent: { type: boolean }
      recipientAccountId: { type: [string, 'null'], format: uuid }
      deliveryChannel: { type: [string, 'null'], maxLength: 64 }
      reviewerAccountId: { type: [string, 'null'], format: uuid }
      approvalReference: { type: [string, 'null'], maxLength: 128 }
      occurredAt: { type: string, format: date-time }

  AccountPage:
    $ref: '#/schemas/AccountPageValue'
  AccountPageValue:
    type: object
    additionalProperties: false
    required: [items, hasMore]
    properties:
      items: { type: array, items: { $ref: '#/schemas/Account' } }
      nextCursor: { type: [string, 'null'], maxLength: 1024 }
      hasMore: { type: boolean }
  RolePage:
    type: object
    additionalProperties: false
    required: [items, hasMore]
    properties:
      items: { type: array, items: { $ref: '#/schemas/Role' } }
      nextCursor: { type: [string, 'null'], maxLength: 1024 }
      hasMore: { type: boolean }
  PermissionPage:
    type: object
    additionalProperties: false
    required: [items, hasMore]
    properties:
      items: { type: array, items: { $ref: '#/schemas/Permission' } }
      nextCursor: { type: [string, 'null'], maxLength: 1024 }
      hasMore: { type: boolean }
  AccountRoleAssignmentPage:
    type: object
    additionalProperties: false
    required: [items, hasMore]
    properties:
      items: { type: array, items: { $ref: '#/schemas/AccountRoleAssignment' } }
      nextCursor: { type: [string, 'null'], maxLength: 1024 }
      hasMore: { type: boolean }
  BreakGlassGrantPage:
    type: object
    additionalProperties: false
    required: [items, hasMore]
    properties:
      items: { type: array, items: { $ref: '#/schemas/BreakGlassGrant' } }
      nextCursor: { type: [string, 'null'], maxLength: 1024 }
      hasMore: { type: boolean }
  AuditEventPage:
    type: object
    additionalProperties: false
    required: [items, hasMore]
    properties:
      items: { type: array, items: { $ref: '#/schemas/AuditEvent' } }
      nextCursor: { type: [string, 'null'], maxLength: 1024 }
      hasMore: { type: boolean }

  AppointmentSlotSession:
    type: string
    enum: [MORNING, AFTERNOON]
  AppointmentSlotStatus:
    type: string
    enum: [ACTIVE, CANCELLED, REPLACED]
  WorkScheduleStatus:
    type: string
    enum: [ACTIVE, CANCELLED]
  SlotHoldStatus:
    type: string
    enum: [ACTIVE, CONSUMED, EXPIRED, RELEASED]
  CreateAppointmentSlotRequest:
    type: object
    additionalProperties: false
    required: [practitionerRoleId, departmentId, roomId, serviceId, session, startAt, endAt, capacity]
    properties:
      practitionerRoleId: { type: string, format: uuid }
      departmentId: { type: string, format: uuid }
      roomId: { type: string, format: uuid }
      serviceId: { type: string, format: uuid }
      session: { $ref: '#/schemas/AppointmentSlotSession' }
      startAt: { type: string, format: date-time }
      endAt: { type: string, format: date-time }
      capacity: { type: integer, minimum: 1, maximum: 100 }
  UpdateAppointmentSlotRequest:
    type: object
    additionalProperties: false
    required: [capacity]
    properties:
      capacity: { type: integer, minimum: 1, maximum: 100 }
  AppointmentSlot:
    type: object
    additionalProperties: false
    required: [id, version, practitionerRoleId, departmentId, roomId, serviceId, session, startAt, endAt, capacity, status, createdAt, updatedAt]
    properties:
      id: { type: string, format: uuid }
      version: { type: integer, format: int64, minimum: 0 }
      practitionerRoleId: { type: string, format: uuid }
      departmentId: { type: string, format: uuid }
      roomId: { type: string, format: uuid }
      serviceId: { type: string, format: uuid }
      session: { $ref: '#/schemas/AppointmentSlotSession' }
      startAt: { type: string, format: date-time }
      endAt: { type: string, format: date-time }
      capacity: { type: integer, minimum: 1 }
      status: { $ref: '#/schemas/AppointmentSlotStatus' }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
  AppointmentSlotPage:
    type: object
    additionalProperties: false
    required: [items, hasMore]
    properties:
      items: { type: array, items: { $ref: '#/schemas/AppointmentSlot' } }
      nextCursor: { type: [string, 'null'], maxLength: 1024 }
      hasMore: { type: boolean }
  BookingAvailabilitySlot:
    type: object
    additionalProperties: false
    required: [id, version, practitionerRoleId, departmentId, roomId, serviceId, session, startAt, endAt, canCreateHold]
    properties:
      id: { type: string, format: uuid }
      version: { type: integer, format: int64, minimum: 0 }
      practitionerRoleId: { type: string, format: uuid }
      departmentId: { type: string, format: uuid }
      roomId: { type: string, format: uuid }
      serviceId: { type: string, format: uuid }
      session: { $ref: '#/schemas/AppointmentSlotSession' }
      startAt: { type: string, format: date-time }
      endAt: { type: string, format: date-time }
      canCreateHold: { type: boolean }
      disabledReason: { type: [string, 'null'], maxLength: 128 }
  BookingAvailabilityPage:
    type: object
    additionalProperties: false
    required: [items, hasMore]
    properties:
      items: { type: array, items: { $ref: '#/schemas/BookingAvailabilitySlot' } }
      nextCursor: { type: [string, 'null'], maxLength: 1024 }
      hasMore: { type: boolean }
  BookingCatalog:
    type: object
    additionalProperties: false
    required: [departments, services]
    properties:
      departments:
        type: array
        items: { $ref: '#/schemas/BookingDepartment' }
      services:
        type: array
        items: { $ref: '#/schemas/BookingService' }
  RescheduleCatalog:
    type: object
    additionalProperties: false
    required: [departments, rooms, services, practitioners, practitionerRoles]
    properties:
      departments:
        type: array
        items: { $ref: '#/schemas/BookingDepartment' }
      rooms:
        type: array
        items: { $ref: '#/schemas/BookingRoom' }
      services:
        type: array
        items: { $ref: '#/schemas/BookingService' }
      practitioners:
        type: array
        items: { $ref: '#/schemas/BookingPractitioner' }
      practitionerRoles:
        type: array
        items: { $ref: '#/schemas/BookingPractitionerRole' }
  BookingDepartment:
    type: object
    additionalProperties: false
    required: [id, name]
    properties:
      id: { type: string, format: uuid }
      name: { type: string, maxLength: 200 }
  BookingRoom:
    type: object
    additionalProperties: false
    required: [id, departmentId, name]
    properties:
      id: { type: string, format: uuid }
      departmentId: { type: string, format: uuid }
      name: { type: string, maxLength: 200 }
  BookingService:
    type: object
    additionalProperties: false
    required: [id, name, priceAmount, priceCurrency]
    properties:
      id: { type: string, format: uuid }
      name: { type: string, maxLength: 200 }
      priceAmount: { type: number, minimum: 0, multipleOf: 0.01 }
      priceCurrency: { type: string, const: VND }
  BookingPractitioner:
    type: object
    additionalProperties: false
    required: [id, fullName]
    properties:
      id: { type: string, format: uuid }
      fullName: { type: string, maxLength: 200 }
  BookingPractitionerRole:
    type: object
    additionalProperties: false
    required: [id, practitionerId, roleCode]
    properties:
      id: { type: string, format: uuid }
      practitionerId: { type: string, format: uuid }
      roleCode: { $ref: '#/schemas/PractitionerRoleCode' }
  WorkSchedule:
    type: object
    additionalProperties: false
    required: [id, bookingSessionId, practitionerRoleId, departmentId, roomId, serviceId, localDate, session, capacity, status, version, slotId, reservedCapacity, remainingCapacity, createdAt, updatedAt]
    properties:
      id: { type: string, format: uuid }
      bookingSessionId: { type: string, format: uuid }
      practitionerRoleId: { type: string, format: uuid }
      departmentId: { type: string, format: uuid }
      roomId: { type: string, format: uuid }
      serviceId: { type: string, format: uuid }
      localDate: { type: string, format: date }
      session: { $ref: '#/schemas/AppointmentSlotSession' }
      capacity: { type: integer, minimum: 1, maximum: 100 }
      status: { $ref: '#/schemas/WorkScheduleStatus' }
      version: { type: integer, format: int64, minimum: 0 }
      slotId: { type: string, format: uuid }
      reservedCapacity: { type: integer, minimum: 0 }
      remainingCapacity: { type: integer, minimum: 0 }
