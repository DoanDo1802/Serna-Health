openapi: 3.1.0
info:
  title: MediCore API
  version: v1
  description: Source-first external API contract for MediCore Release 1.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /api/v1
tags:
  - name: IdentityAccess
    description: identity-access module — R1-02
  - name: PlatformAudit
    description: platform-audit module — R1-02
  - name: Catalog
    description: catalog module — R1-03
  - name: Patient
    description: patient module — R1-04
  - name: SchedulingPayment
    description: scheduling-payment module — R1-05,R1-06,R1-07
  - name: ReceptionQueue
    description: reception-queue module — R1-08,R1-09,R1-13
  - name: ClinicalCare
    description: clinical-care module — R1-10,R1-11
  - name: BillingPayment
    description: billing-payment module — R1-11,R1-12,R1-13
  - name: Notification
    description: notification module — R1-14
paths:
  /auth/registrations:
    post:
      tags:
        - IdentityAccess
      summary: Register Account
      operationId: registerAccount
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: []
      responses:
        "202":
          description: Request accepted without exposing resource existence.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Domain state or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
      x-medicore-module: identity-access
      x-medicore-permission: account.register
      x-medicore-audit-action: account.register
      x-medicore-stories:
        - R1-02
      x-medicore-scenarios: &a1
        - SC-R1-AUTH-01
        - SC-R1-AUTH-02
        - SC-R1-AUTH-03
        - SC-R1-SEC-01
        - SC-R1-REL-01
      x-medicore-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegistrationRequest"
