paths:
  /notifications:
    get:
      tags:
        - Notification
      summary: List My Notifications
      operationId: listMyNotifications
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPage"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Contextual permission denied
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Resource not found or intentionally concealed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Domain state or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
      x-medicore-module: notification
      x-medicore-permission: notification.read
      x-medicore-audit-action: notification.read
      x-medicore-stories:
        - R1-14
      x-medicore-scenarios: &a1
        - R1-14-NOTIFICATION-RELIABILITY
      x-medicore-idempotent: false
  /notifications/{notificationId}:
    get:
      tags:
        - Notification
      summary: Get My Notification
      operationId: getMyNotification
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Contextual permission denied
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Resource not found or intentionally concealed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Domain state or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
      x-medicore-module: notification
      x-medicore-permission: notification.read
      x-medicore-audit-action: notification.read
      x-medicore-stories:
        - R1-14
      x-medicore-scenarios: *a1
      x-medicore-idempotent: false
  /notifications/{notificationId}/actions/cancel:
    post:
      tags:
        - Notification
      summary: Cancel Notification
      operationId: cancelNotification
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Successful response.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Contextual permission denied
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Resource not found or intentionally concealed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Domain state or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: ETag precondition failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
      x-medicore-module: notification
      x-medicore-permission: notification.cancel
      x-medicore-audit-action: notification.cancel
      x-medicore-stories:
        - R1-14
      x-medicore-scenarios: *a1
      x-medicore-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resource"
