paths:
  /notifications:
    get:
      tags:
        - Notification
      summary: List My Notifications
      operationId: listMyNotifications
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Successful response.
          headers:
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPage"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Contextual permission denied
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Domain state or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      x-medicore-module: notification
      x-medicore-permission: notification.read
      x-medicore-audit-action: notification.read
      x-medicore-stories:
        - R1-14
      x-medicore-scenarios: &a1
        - R1-14-NOTIFICATION-RELIABILITY
      x-medicore-idempotent: false
  /notifications/{notificationId}:
    get:
      tags:
        - Notification
      summary: Get My Notification
      operationId: getMyNotification
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Successful response.
          headers:
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Contextual permission denied
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Domain state or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      x-medicore-module: notification
      x-medicore-permission: notification.read
      x-medicore-audit-action: notification.read
      x-medicore-stories:
        - R1-14
      x-medicore-scenarios: *a1
      x-medicore-idempotent: false
  /notifications/{notificationId}/actions/cancel:
    post:
      tags:
        - Notification
      summary: Cancel Notification
      operationId: cancelNotification
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: ^"[0-9]+"$
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Successful response.
          headers:
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Contextual permission denied
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Domain state or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: ETag precondition failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      x-medicore-module: notification
      x-medicore-permission: notification.cancel
      x-medicore-audit-action: notification.cancel
      x-medicore-stories:
        - R1-14
      x-medicore-scenarios: *a1
      x-medicore-idempotent: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Resource"
