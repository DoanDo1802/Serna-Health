        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      security: []
      responses:
        "202":
          description: Request accepted without exposing resource existence.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Domain state or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
      x-medicore-module: identity-access
      x-medicore-permission: account.register
      x-medicore-audit-action: account.register
      x-medicore-stories:
        - R1-02
      x-medicore-scenarios: &a1
        - SC-R1-AUTH-01
        - SC-R1-AUTH-02
        - SC-R1-AUTH-03
        - SC-R1-SEC-01
        - SC-R1-REL-01
      x-medicore-idempotent: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
