            maxLength: 128
      security: []
      responses:
        "202":
          description: Request accepted without exposing resource existence.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    const: true
                  requestId:
                    type: string
                required:
                  - accepted
                  - requestId
