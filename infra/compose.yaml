name: medicore-local
services:
  postgres:
    image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_DB: ${MEDICORE_DB_NAME:-medicore}
      POSTGRES_USER: ${MEDICORE_DB_USERNAME:-medicore}
      POSTGRES_PASSWORD: ${MEDICORE_DB_PASSWORD:-medicore-local-only}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${MEDICORE_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - medicore_postgres_data:/var/lib/postgresql/data

volumes:
  medicore_postgres_data:
