name: medicore-local
services:
  postgres:
    image: postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    environment:
      POSTGRES_DB: ${MEDICORE_DB_NAME:-medicore}
      POSTGRES_USER: ${MEDICORE_DB_USERNAME:-medicore}
      POSTGRES_PASSWORD: ${MEDICORE_DB_PASSWORD:-medicore-local-only}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${MEDICORE_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - medicore_postgres_data:/var/lib/postgresql/data

volumes:
  medicore_postgres_data:
